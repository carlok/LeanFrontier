name: reconcile-generated

# Generated pull requests are opened concurrently by independent workflows and
# each enables auto-merge. The ruleset requires a branch to be up to date, and
# auto-merge does not update branches, so the moment one of them merges the
# others are left BEHIND with every check green and no way to proceed. Merging
# the bounded-slope submission produced three such pull requests and two
# needed a manual update-branch.
#
# Every merge to main therefore brings the stragglers forward. Updating a
# branch pushes to that branch rather than to main, so this cannot retrigger
# itself.
#
# Staleness is read from the commit graph, not from mergeStateStatus. GitHub
# recomputes that field lazily, and when main moved while a generated pull
# request's required checks were still running it read neither BEHIND nor
# UNKNOWN a few seconds later (#184 after #183, #199 after #198), so the
# straggler sat with auto-merge armed until someone updated it by hand.
#
# Completed check runs also trigger a pass, which catches a generated branch
# pushed after the merge's own pass had already listed pull requests. That
# trigger runs with a write token even for fork pull requests, so this job
# never checks out or reads anything from the triggering run: it only acts on
# open pull requests authored by the app.

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [test, validate-submission]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reconcile-generated
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a generator token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Bring generated pull requests up to date
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          candidates="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 \
            --json number,headRefName,headRefOid,baseRefName,author \
            --jq '.[]
                  | select(.headRefName | startswith("automation/generated/"))
                  | select(.author.login == "app/${{ steps.app-token.outputs.app-slug }}")
                  | "\(.number) \(.baseRefName) \(.headRefOid)"')"
          updated=0
          failed=0
          while read -r number base sha; do
            [ -n "$number" ] || continue
            # Commits on the base branch that the head does not contain.
            behind_by="$(gh api "repos/$GITHUB_REPOSITORY/compare/${base}...${sha}" --jq .behind_by)"
            if [ "$behind_by" -gt 0 ]; then
              echo "updating #$number ($behind_by behind $base)"
              if gh pr update-branch "$number" --repo "$GITHUB_REPOSITORY"; then
                updated=$((updated + 1))
              else
                failed=1
              fi
            fi
          done <<< "$candidates"
          if [ "$updated" = "0" ] && [ "$failed" = "0" ]; then
            echo "no generated pull request is behind"
          fi
          exit "$failed"
