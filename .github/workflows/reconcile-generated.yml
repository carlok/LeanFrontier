name: reconcile-generated

# Generated pull requests are opened concurrently by independent workflows and
# each enables auto-merge. The ruleset requires a branch to be up to date, and
# auto-merge does not update branches, so the moment one of them merges the
# others are left BEHIND with every check green and no way to proceed. Merging
# the bounded-slope submission produced three such pull requests and two
# needed a manual update-branch.
#
# Every merge to main therefore brings the stragglers forward. Updating a
# branch pushes to that branch rather than to main, so this cannot retrigger
# itself.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: reconcile-generated
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a generator token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - name: Bring generated pull requests up to date
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # GitHub recomputes mergeability asynchronously, so a pull request
          # reads UNKNOWN for a few seconds after the push that stales it.
          behind=""
          for attempt in 1 2 3 4 5 6; do
            behind="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
              --json number,headRefName,mergeStateStatus,author \
              --jq '.[]
                    | select(.headRefName | startswith("automation/generated/"))
                    | select(.author.login == "app/${{ steps.app-token.outputs.app-slug }}")
                    | select(.mergeStateStatus == "BEHIND")
                    | .number')"
            unknown="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
              --json number,headRefName,mergeStateStatus \
              --jq '[.[] | select(.headRefName | startswith("automation/generated/"))
                     | select(.mergeStateStatus == "UNKNOWN")] | length')"
            [ -n "$behind" ] && break
            [ "$unknown" = "0" ] && break
            sleep 10
          done
          if [ -z "$behind" ]; then
            echo "no generated pull request is behind"
            exit 0
          fi
          for number in $behind; do
            echo "updating #$number"
            gh pr update-branch "$number" --repo "$GITHUB_REPOSITORY"
          done
