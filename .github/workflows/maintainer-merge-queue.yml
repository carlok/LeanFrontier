name: maintainer-merge-queue

# The sequencing a maintainer otherwise does by hand, one pull request at a
# time. `main` requires branches to be up to date, so every merge leaves the
# other open pull requests behind: each one then needs its branch updated and
# the whole receiver run again before it can merge. On a twenty-submission day
# that is hours of waiting and clicking.
#
# This automates the waiting, never the decision. It merges only what the
# receiver has already accepted and what GitHub already considers mergeable. It
# holds no administrator override, arms nothing to merge later, and stops on
# the first genuine check failure rather than working around it. Running it is
# an ordinary maintainer action: workflow_dispatch requires write access.

on:
  workflow_dispatch:
    inputs:
      pull_requests:
        description: Pull request numbers to merge, in order, separated by spaces.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: maintainer-merge-queue
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    # Each pull request costs a branch update plus a full revalidation, which
    # ran 4 to 11 minutes per submission on 22 September.
    timeout-minutes: 300
    steps:
      - name: Mint a merge token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Merge the listed pull requests in order
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Through the environment, never interpolated into the script.
          PULL_REQUESTS: ${{ inputs.pull_requests }}
        run: |
          set -uo pipefail
          # In a variable: [[ =~ ]] splits an unquoted pattern on the space
          # inside the bracket expression and fails to parse.
          numbers='^[0-9 ]+$'
          [[ "$PULL_REQUESTS" =~ $numbers ]] || { echo "pull_requests must be numbers separated by spaces" >&2; exit 1; }

          generated_open() {
            gh pr list --repo "$GITHUB_REPOSITORY" --state open --json headRefName \
              --jq '[.[] | select(.headRefName | startswith("automation/generated/"))] | length'
          }

          # The app token lasts an hour and cannot be renewed inside this step.
          # Stop well before it expires, saying what is left, rather than
          # looping on 401s until someone cancels the run.
          started=$(date +%s)
          remaining="$PULL_REQUESTS"

          for pr in $PULL_REQUESTS; do
            echo "::group::#$pr"
            settled=false
            for attempt in $(seq 1 120); do
              if (( $(date +%s) - started > 50 * 60 )); then
                echo "::error::stopping before the app token expires; re-run the queue with: $remaining"
                exit 1
              fi
              # The generators open their own pull requests after each merge and
              # auto-merge them. Merging past them races the corpus they record.
              if [ "$(generated_open)" != "0" ]; then
                for generated in $(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
                    --json number,headRefName,mergeStateStatus \
                    --jq '.[] | select(.headRefName | startswith("automation/generated/")) | select(.mergeStateStatus == "BEHIND") | .number'); do
                  echo "generated #$generated is behind; updating it"
                  gh pr update-branch "$generated" --repo "$GITHUB_REPOSITORY" || true
                done
                sleep 30
                continue
              fi

              state="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json state,mergeStateStatus --jq '.state + " " + .mergeStateStatus')"
              case "$state" in
                "MERGED "*) echo "#$pr merged"; settled=true; break ;;
                "CLOSED "*) echo "#$pr is closed; skipping"; settled=true; break ;;
                "OPEN CLEAN")
                  echo "#$pr is mergeable; merging"
                  gh pr merge "$pr" --repo "$GITHUB_REPOSITORY" --merge
                  sleep 20
                  ;;
                *)
                  # A branch behind main fails the receiver by construction: it
                  # is diffed against a base it does not contain. Read staleness
                  # from the commit graph rather than from mergeStateStatus,
                  # which lags and reports BLOCKED while checks are pending.
                  head="$(gh pr view "$pr" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
                  behind="$(gh api "repos/$GITHUB_REPOSITORY/compare/${{ github.event.repository.default_branch }}...$head" --jq .behind_by)"
                  if [ "$behind" != "0" ]; then
                    echo "#$pr is $behind commits behind; updating and revalidating"
                    if ! output="$(gh pr update-branch "$pr" --repo "$GITHUB_REPOSITORY" 2>&1)"; then
                      echo "$output"
                      # The app holds no `workflows` permission, deliberately:
                      # it would let it rewrite the workflows that constrain it.
                      # So while main has workflow changes a branch lacks, only
                      # a person can bring that branch up to date.
                      if grep -q "workflows. permission" <<<"$output"; then
                        echo "::error::cannot update #$pr: main has workflow changes this branch lacks, and the app may not push workflow files. Run 'gh pr update-branch $pr' as a maintainer, then re-run the queue."
                      else
                        echo "::error::cannot update #$pr; a fork branch needs 'allow edits by maintainers'"
                      fi
                      exit 1
                    fi
                    sleep 45
                    continue
                  fi
                  # Captured, not piped: gh exits 1 when a check has failed, and
                  # under pipefail that status used to override grep's match, so
                  # a failing check read as none and the queue waited an hour.
                  # And guarded: Actions runs this step with bash -e, so a bare
                  # assignment from gh's 8 ("still pending") ended the step (#436).
                  # BEGIN read-checks
                  checks_status=0
                  checks="$(gh pr checks "$pr" --repo "$GITHUB_REPOSITORY" 2>&1)" || checks_status=$?
                  if awk -F'\t' '$2 == "fail"' <<<"$checks" | grep -q .; then
                    echo "$checks"
                    echo "::error::#$pr has a failing check; stopping so a person can look"
                    exit 1
                  fi
                  # 0: all passed, 1: something failed, 8: still pending. Any
                  # other failure without a table of checks is gh failing.
                  if [ "$checks_status" -ne 0 ] && ! grep -q $'\t' <<<"$checks"; then
                    echo "$checks"
                    echo "::error::cannot read the checks of #$pr"
                    exit 1
                  fi
                  # END read-checks
                  (( attempt % 10 == 0 )) && echo "#$pr: still waiting ($state)"
                  sleep 30
                  ;;
              esac
            done
            if [ "$settled" != true ]; then
              echo "::error::#$pr neither merged nor failed within the wait; stopping. Re-run with: $remaining"
              exit 1
            fi
            remaining="${remaining#"$pr"}"
            remaining="${remaining# }"
            echo "::endgroup::"
          done

          echo "### Merge queue finished" >> "$GITHUB_STEP_SUMMARY"
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName \
            --jq '.[] | "- #\(.number) \(.headRefName)"' >> "$GITHUB_STEP_SUMMARY"
