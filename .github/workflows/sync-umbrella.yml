name: sync-umbrella

on:
  push:
    branches: [main]
    paths:
      - LeanFrontier/**/*.lean
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - run: python3 tools/generate_umbrella.py
      - name: Commit the trusted generated umbrella when needed
        run: |
          git diff --quiet -- LeanFrontier.lean && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LeanFrontier.lean
          git commit -m "chore: sync LeanFrontier umbrella"
          git push
