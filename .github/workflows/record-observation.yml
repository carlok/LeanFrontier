name: record-observation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record immutable submission claims present at this revision
        run: |
          python3 -c "import json,pathlib; print(json.dumps({'revision': '${{ github.sha }}', 'claims': sorted(p.name for p in pathlib.Path('Submissions').glob('*.json'))}, indent=2))"
          | tee receiver-observation.json
      - uses: actions/upload-artifact@v4
        with:
          name: receiver-observation-${{ github.sha }}
          path: receiver-observation.json
