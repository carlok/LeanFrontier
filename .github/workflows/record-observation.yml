name: record-observation

on:
  # Merges to main only: the branch ruleset requires a pull request, so every
  # push here is an already-reviewed merge commit belonging to this repository.
  # There is no fork context and no unmerged code, which is why this does not
  # use pull_request_target — that trigger now needs an explicit unsafe opt-in
  # to read a fork's merge commit, and needs it for good reason.
  push:
    branches: [main]

permissions:
  # `read` downloads the receiver artifact; `write` is additionally required to
  # dispatch the checks that protect the generated pull request this job opens,
  # matching sync-umbrella and sync-catalogue.
  actions: write
  contents: write
  pull-requests: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a generator token
        # PRs opened with GITHUB_TOKEN do not trigger workflow runs, so their
        # required checks sit unfulfilled and auto-merge never fires. An app
        # installation token is a distinct identity, and its pull requests are
        # ordinary ones.
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          # Both parents must be present: `^1` is the trusted base this merge
          # was validated against, `^2` is the candidate head whose receiver
          # artifact carries the report. A shallow checkout resolves neither
          # and would silently record nothing.
          fetch-depth: 2
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - id: submission
        name: Find the merged submission record
        run: |
          merge="${{ github.sha }}"
          git rev-parse --verify --quiet "$merge^1" > /dev/null
          mapfile -t records < <(git diff --name-only "$merge^1" "$merge" -- 'Submissions/*.json')
          if [ "${#records[@]}" -eq 0 ]; then
            echo "should_record=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "${#records[@]}" -eq 1
          base="$(git rev-parse "$merge^1")"
          head="$(git rev-parse --verify --quiet "$merge^2" || git rev-parse "$merge")"
          {
            echo "should_record=true"
            echo "path=${records[0]}"
            echo "base=$base"
            echo "head=$head"
            echo "merged_at=$(git log -1 --format=%cI "$merge")"
          } >> "$GITHUB_OUTPUT"
      - name: Refuse to record if the merge touched trusted infrastructure
        if: steps.submission.outputs.should_record == 'true'
        run: |
          merge="${{ github.sha }}"
          changed="$(git diff --name-only "$merge^1" "$merge" -- \
            .github tools policy schema lakefile.toml lake-manifest.json lean-toolchain)"
          if [ -n "$changed" ]; then
            echo "::error::a submission merge modified trusted infrastructure:"
            echo "$changed"
            exit 1
          fi
      - name: Check out the trusted receiver revision
        if: steps.submission.outputs.should_record == 'true'
        uses: actions/checkout@v5
        with:
          # Scripts run from the base revision, never from the merged tree: the
          # post-merge writer holds a write token, and its safety must not
          # depend on the receiver having rejected a change to tools/.
          ref: ${{ steps.submission.outputs.base }}
          path: .trusted-receiver
          fetch-depth: 1
          persist-credentials: false
      - name: Retrieve the successful trusted receiver artifact
        if: steps.submission.outputs.should_record == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow validate-submission.yml \
            --commit "${{ steps.submission.outputs.head }}" \
            --json databaseId,conclusion,url \
            --jq '[.[] | select(.conclusion == "success")][0].databaseId')"
          test -n "$run_id"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name leanfrontier-validation-report --dir receiver-artifact
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json url --jq .url > validation-run.txt
      - name: Persist the trusted receiver observation
        if: steps.submission.outputs.should_record == 'true'
        run: >-
          python3 .trusted-receiver/tools/persist_observation.py
          --report receiver-artifact/report-output/report.json
          --submission "${{ steps.submission.outputs.path }}"
          --accepted-revision ${{ github.sha }}
          --candidate-revision ${{ steps.submission.outputs.head }}
          --trusted-receiver-revision ${{ steps.submission.outputs.base }}
          --validation-run "$(cat validation-run.txt)"
          --observed-at "${{ steps.submission.outputs.merged_at }}"
      - name: Regenerate the catalogue from the trusted observation
        if: steps.submission.outputs.should_record == 'true'
        run: python3 .trusted-receiver/tools/generate_catalogue.py --root .
      - name: Open a protected generated-output pull request
        if: steps.submission.outputs.should_record == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git diff --quiet -- receiver-observations docs/catalogue/index.html && exit 0
          branch="automation/generated/observation-${{ github.run_id }}"
          git switch -c "$branch"
          slug="${{ steps.app-token.outputs.app-slug }}"
          git config user.name "$slug[bot]"
          git config user.email "$(gh api "/users/$slug%5Bbot%5D" --jq .id)+$slug[bot]@users.noreply.github.com"
          git add receiver-observations docs/catalogue/index.html
          git commit -m "chore: record receiver observation"
          git push origin "HEAD:$branch"
          pr="$(gh pr create --base main --head "$branch" --title "chore: record receiver observation" --body "Trusted receiver observation from run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.")"
          gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run validate-submission.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" \
            -f trusted_ref="${{ github.sha }}" -f candidate_ref="$branch" -f generated=true
          gh pr merge "$pr" --auto --merge
