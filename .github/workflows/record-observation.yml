name: record-observation

on:
  # A closed PR from a fork keeps a read-only GITHUB_TOKEN under pull_request.
  # This job runs only after merge and checks out the merge commit explicitly,
  # so pull_request_target grants the trusted post-merge writer without ever
  # executing unmerged fork code.
  pull_request_target:
    types: [closed]

permissions:
  actions: read
  contents: write
  pull-requests: write

jobs:
  persist:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          # The merge parent must be present: a shallow checkout cannot diff
          # against `<merge>^1` and would silently record no observation.
          fetch-depth: 2
          persist-credentials: true
      - id: submission
        name: Find the merged submission record
        run: |
          git rev-parse --verify --quiet "${{ github.event.pull_request.merge_commit_sha }}^1" > /dev/null
          mapfile -t records < <(git diff --name-only "${{ github.event.pull_request.merge_commit_sha }}^1" "${{ github.event.pull_request.merge_commit_sha }}" -- 'Submissions/*.json')
          if [ "${#records[@]}" -eq 0 ]; then
            echo "should_record=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "${#records[@]}" -eq 1
          echo "should_record=true" >> "$GITHUB_OUTPUT"
          echo "path=${records[0]}" >> "$GITHUB_OUTPUT"
      - name: Refuse to record if the merge touched trusted infrastructure
        if: steps.submission.outputs.should_record == 'true'
        run: |
          merge="${{ github.event.pull_request.merge_commit_sha }}"
          changed="$(git diff --name-only "$merge^1" "$merge" -- \
            .github tools policy schema lakefile.toml lake-manifest.json lean-toolchain)"
          if [ -n "$changed" ]; then
            echo "::error::a submission merge modified trusted infrastructure:"
            echo "$changed"
            exit 1
          fi
      - name: Check out the trusted receiver revision
        if: steps.submission.outputs.should_record == 'true'
        uses: actions/checkout@v5
        with:
          # Scripts run from the base revision, never from the merged tree: the
          # post-merge writer holds a write token, and its safety must not
          # depend on the receiver having rejected a change to tools/.
          ref: ${{ github.event.pull_request.base.sha }}
          path: .trusted-receiver
          fetch-depth: 1
          persist-credentials: false
      - name: Retrieve the successful trusted receiver artifact
        if: steps.submission.outputs.should_record == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow validate-submission.yml \
            --commit "${{ github.event.pull_request.head.sha }}" \
            --json databaseId,conclusion,url \
            --jq '[.[] | select(.conclusion == "success")][0].databaseId')"
          test -n "$run_id"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" \
            --name leanfrontier-validation-report --dir receiver-artifact
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json url --jq .url > validation-run.txt
      - name: Persist the trusted receiver observation
        if: steps.submission.outputs.should_record == 'true'
        run: >-
          python3 .trusted-receiver/tools/persist_observation.py
          --report receiver-artifact/report-output/report.json
          --submission "${{ steps.submission.outputs.path }}"
          --accepted-revision ${{ github.event.pull_request.merge_commit_sha }}
          --candidate-revision ${{ github.event.pull_request.head.sha }}
          --trusted-receiver-revision ${{ github.event.pull_request.base.sha }}
          --validation-run "$(cat validation-run.txt)"
          --observed-at "${{ github.event.pull_request.merged_at }}"
      - name: Regenerate the catalogue from the trusted observation
        if: steps.submission.outputs.should_record == 'true'
        run: python3 .trusted-receiver/tools/generate_catalogue.py --root .
      - name: Open a protected generated-output pull request
        if: steps.submission.outputs.should_record == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- receiver-observations docs/catalogue/index.html && exit 0
          branch="automation/generated/observation-${{ github.run_id }}"
          git switch -c "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add receiver-observations docs/catalogue/index.html
          git commit -m "chore: record receiver observation"
          git push origin "HEAD:$branch"
          pr="$(gh pr create --base main --head "$branch" --title "chore: record receiver observation" --body "Trusted receiver observation from run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.")"
          gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run validate-submission.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" \
            -f trusted_ref="${{ github.event.pull_request.merge_commit_sha }}" -f candidate_ref="$branch" -f generated=true
          gh pr merge "$pr" --auto --merge
