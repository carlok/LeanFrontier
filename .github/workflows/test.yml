name: test

on:
  # Only main: a branch push and its pull_request event used to run the
  # 40-minute Mathlib re-audit twice under one required check name, and the
  # slower copy decided the result.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run validator tests with coverage
        run: >-
          python3 -m coverage run -m unittest discover -s tests -v
          && python3 -m coverage report
          && python3 -m coverage xml -o coverage.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: warn

  mathlib-upgrade:
    name: mathlib-upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Skip ordinary pull requests
        id: target
        # Gate on the pull request's author, not on github.actor: the actor is
        # whoever last pushed or re-ran, so a maintainer updating an upgrade
        # branch used to skip the re-audit and report green on stale evidence.
        env:
          REF: ${{ github.head_ref || github.ref_name }}
          AUTHOR: ${{ github.event.pull_request.user.login || github.actor }}
        run: |
          if [[ "$REF" == maintenance/mathlib-upgrade-* && "$AUTHOR" == "leanfrontier-receiver[bot]" ]]; then echo "enabled=true" >> "$GITHUB_OUTPUT"; else echo "enabled=false" >> "$GITHUB_OUTPUT"; fi
      - name: Build the trusted validator image
        if: steps.target.outputs.enabled == 'true'
        run: docker build -f tools/Dockerfile.validator -t leanfrontier-upgrade:ci .
      - name: Acquire the selected toolchain and Mathlib cache
        if: steps.target.outputs.enabled == 'true'
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE/elan:/elan"
          -v "$GITHUB_WORKSPACE:/workspace"
          -w /workspace
          leanfrontier-upgrade:ci sh -c 'lake update && lake exe cache get && lake build Mathlib'
      - name: Rebuild the active index and audit the whole corpus
        if: steps.target.outputs.enabled == 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/upgrade-output"
          chmod 777 "$GITHUB_WORKSPACE/upgrade-output"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 6g --cpus 2 --pids-limit 512 --tmpfs /tmp:size=6g \
            -v "$GITHUB_WORKSPACE/elan:/elan:ro" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$GITHUB_WORKSPACE/upgrade-output:/output" -w /workspace \
            leanfrontier-upgrade:ci \
            python3 tools/build_mathlib_index.py --output /output/rebuilt-index.json
          index_name="$(python3 -c 'import json; print(json.load(open("policy/mathlib-release.json"))["fingerprint_index"])')"
          cmp "$GITHUB_WORKSPACE/upgrade-output/rebuilt-index.json" "policy/$index_name"
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --memory 6g --cpus 2 --pids-limit 512 --tmpfs /tmp:size=6g \
            -v "$GITHUB_WORKSPACE/elan:/elan:ro" -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -v "$GITHUB_WORKSPACE/upgrade-output:/output" \
            leanfrontier-upgrade:ci \
            python3 tools/audit_mathlib_upgrade.py --report /output/rebuilt-audit.json
          audit_name="$(python3 -c 'import json; print(json.load(open("policy/mathlib-release.json"))["mathlib_revision"])')"
          cmp "$GITHUB_WORKSPACE/upgrade-output/rebuilt-audit.json" "policy/mathlib-upgrades/$audit_name.json"
      - uses: actions/upload-artifact@v4
        if: always() && steps.target.outputs.enabled == 'true'
        with:
          name: mathlib-upgrade-report
          path: policy/mathlib-upgrades/
          if-no-files-found: warn
