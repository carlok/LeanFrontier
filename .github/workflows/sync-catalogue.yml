name: sync-catalogue

on:
  push:
    branches: [main]
    paths:
      - LeanFrontier/**/*.lean
      - Submissions/**/*.json
      - receiver-observations/**/*.json
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: trusted-generated-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a generator token
        # PRs opened with GITHUB_TOKEN do not trigger workflow runs, so their
        # required checks sit unfulfilled and auto-merge never fires. An app
        # installation token is a distinct identity, and its pull requests are
        # ordinary ones.
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          # The ownership check below diffs this push against its predecessor.
          fetch-depth: 2
          persist-credentials: true
      - id: ownership
        name: Defer to the observation writer when a submission landed
        # The catalogue renders three inputs: module source, submission claims,
        # and receiver observations. A submission merge changes the first two
        # before the third exists, so a render started here carries no
        # receiver-report links. record-observation regenerates the catalogue
        # after it writes the report, and its render is the complete one.
        # Racing it can only publish a staler file, and whichever pull request
        # loses the race is left behind the other.
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'Submissions/*.json' | grep -q .; then
            echo "a submission record changed in this push; the observation writer owns the catalogue"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ownership.outputs.skip != 'true'
        run: python3 tools/generate_catalogue.py
      - name: Open a protected generated-output pull request
        if: steps.ownership.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git diff --quiet -- docs/catalogue/index.html && exit 0
          branch="automation/generated/catalogue-${{ github.run_id }}"
          git switch -c "$branch"
          slug="${{ steps.app-token.outputs.app-slug }}"
          git config user.name "$slug[bot]"
          git config user.email "$(gh api "/users/$slug%5Bbot%5D" --jq .id)+$slug[bot]@users.noreply.github.com"
          git add docs/catalogue/index.html
          git commit -m "chore: sync theorem catalogue"
          git push origin "HEAD:$branch"
          pr="$(gh pr create --base main --head "$branch" --title "chore: sync theorem catalogue" --body "Trusted generated output from run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.")"
          gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run validate-submission.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" \
            -f trusted_ref="${{ github.sha }}" -f candidate_ref="$branch" -f generated=true
          gh pr merge "$pr" --auto --merge
