name: sync-catalogue

on:
  push:
    branches: [main]
    paths:
      - LeanFrontier/**/*.lean
      - Submissions/**/*.json
      - receiver-observations/**/*.json
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: trusted-generated-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mint a generator token
        # PRs opened with GITHUB_TOKEN do not trigger workflow runs, so their
        # required checks sit unfulfilled and auto-merge never fires. An app
        # installation token is a distinct identity, and its pull requests are
        # ordinary ones.
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
      - run: python3 tools/generate_catalogue.py
      - name: Open a protected generated-output pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git diff --quiet -- docs/catalogue/index.html && exit 0
          branch="automation/generated/catalogue-${{ github.run_id }}"
          git switch -c "$branch"
          slug="${{ steps.app-token.outputs.app-slug }}"
          git config user.name "$slug[bot]"
          git config user.email "$(gh api "/users/$slug%5Bbot%5D" --jq .id)+$slug[bot]@users.noreply.github.com"
          git add docs/catalogue/index.html
          git commit -m "chore: sync theorem catalogue"
          git push origin "HEAD:$branch"
          pr="$(gh pr create --base main --head "$branch" --title "chore: sync theorem catalogue" --body "Trusted generated output from run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.")"
          gh workflow run test.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
          gh workflow run validate-submission.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" \
            -f trusted_ref="${{ github.sha }}" -f candidate_ref="$branch" -f generated=true
          gh pr merge "$pr" --auto --merge
