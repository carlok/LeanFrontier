name: validate-submission

on:
  pull_request:
  workflow_dispatch:
    inputs:
      trusted_ref:
        description: Trusted base commit or ref to validate against
        required: true
        type: string
      candidate_ref:
        description: Untrusted candidate commit or ref to validate
        required: true
        type: string
      generated:
        description: Validate a trusted generated-output maintenance PR
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    # A branch name is submitter-controlled, so it never grants an exemption on
    # its own: only a trusted author on a trusted prefix reaches another job.
    # Everything else falls through to the ordinary receiver. The trusted
    # author is the LeanFrontier Receiver app, not github-actions[bot]: pull
    # requests opened with GITHUB_TOKEN never trigger the checks that protect
    # them, which is why the generators authenticate as the app instead.
    if: >-
      github.event_name == 'pull_request' &&
      !(startsWith(github.event.pull_request.head.ref, 'automation/generated/') &&
        github.event.pull_request.user.login == 'leanfrontier-receiver[bot]') &&
      !(startsWith(github.event.pull_request.head.ref, 'maintenance/') &&
        (github.event.pull_request.author_association == 'OWNER' ||
         github.event.pull_request.user.login == 'leanfrontier-receiver[bot]'))
    runs-on: ubuntu-latest
    # Raised from 12 when the kernel recheck was added: the Furstenberg
    # submission's validate job already ran 7m31s before it existed.
    timeout-minutes: 20
    steps:
      - name: Check out trusted receiver revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.trusted_ref || github.event.pull_request.base.sha || github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Check out untrusted candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      # The receiver diffs trees, so a head that lacks commits the base has
      # reads as deleting and editing them. Counted from the commit graph with
      # the read-only token; a failed call fails the job rather than guessing.
      - name: Count commits the candidate lacks
        id: freshness
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          behind="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$HEAD_SHA" --jq .behind_by)"
          [[ "$behind" =~ ^[0-9]+$ ]]
          echo "behind=$behind" >> "$GITHUB_OUTPUT"

      # A documentation proposal (Markdown under docs/, no Lean, no claim) is
      # accepted here and stops: there is nothing to build, and no candidate
      # code should run for it. The trusted receiver decides that from the
      # changed paths, never from the branch name.
      - name: Trusted cheap preflight
        id: preflight
        env:
          BEHIND_BY: ${{ steps.freshness.outputs.behind || '0' }}
        run: |
          python3 trusted/tools/validate-submission \
            --base-dir "$GITHUB_WORKSPACE/trusted" \
            --candidate-dir "$GITHUB_WORKSPACE/candidate" \
            --preflight-only \
            --behind-by "$BEHIND_BY" \
            --json-out "$GITHUB_WORKSPACE/preflight-report.json"
          docs_only="$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["observed"].get("docs_only", False)).lower())' "$GITHUB_WORKSPACE/preflight-report.json")"
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

      - name: Build trusted validation image
        if: steps.preflight.outputs.docs_only != 'true'
        run: docker build -f trusted/tools/Dockerfile.validator -t leanfrontier-validator:ci trusted

      # The candidate lakefile has already been proven identical to trusted
      # infrastructure. Network is available only for dependency acquisition.
      - name: Fetch pinned dependencies and compiled Mathlib cache
        if: steps.preflight.outputs.docs_only != 'true'
        run: |
          for attempt in 1 2 3; do
            docker run --rm \
              -v "$GITHUB_WORKSPACE/elan:/elan" \
              -v "$GITHUB_WORKSPACE/candidate:/candidate" \
              -w /candidate \
              leanfrontier-validator:ci sh -c 'lake update && lake exe cache get && lake build Mathlib' && exit 0
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done

      - name: Restricted formal validation
        if: steps.preflight.outputs.docs_only != 'true'
        run: |
          mkdir -p "$GITHUB_WORKSPACE/report-output"
          chmod 0777 "$GITHUB_WORKSPACE/report-output"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --memory 2g --cpus 2 --pids-limit 512 \
            --tmpfs /tmp:size=2g \
            -v "$GITHUB_WORKSPACE/elan:/elan:ro" \
            -v "$GITHUB_WORKSPACE/trusted:/trusted:ro" \
            -v "$GITHUB_WORKSPACE/candidate:/candidate:ro" \
            -v "$GITHUB_WORKSPACE/candidate/.lake:/candidate/.lake" \
            -v "$GITHUB_WORKSPACE/report-output:/report-output" \
            -w /candidate \
            -e PYTHONPATH=/trusted/tools \
            leanfrontier-validator:ci \
            python3 /trusted/tools/validate-submission \
            --base-dir /trusted --candidate-dir /candidate \
            --json-out /report-output/report.json

      - name: Upload receiver report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leanfrontier-validation-report
          path: |
            preflight-report.json
            report-output/report.json
          if-no-files-found: warn

  validate-generated:
    if: >-
      (github.event_name == 'pull_request' &&
       startsWith(github.event.pull_request.head.ref, 'automation/generated/') &&
       github.event.pull_request.user.login == 'leanfrontier-receiver[bot]') ||
      (github.event_name == 'workflow_dispatch' && inputs.generated == true)
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.trusted_ref || github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_ref || github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - run: >-
          python3 trusted/tools/validate_generated.py
          --base trusted --candidate candidate

  validate-maintenance:
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'maintenance/') &&
      (github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.user.login == 'leanfrontier-receiver[bot]')
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Confirm this is an owner maintenance pull request
        run: |
          git -C candidate diff --check
          if [[ "${{ github.event.pull_request.head.ref }}" == maintenance/mathlib-upgrade-* && "${{ github.event.pull_request.user.login }}" == "leanfrontier-receiver[bot]" ]]; then
            python3 trusted/tools/validate_mathlib_upgrade.py --base trusted --candidate candidate
          fi
