name: validate-submission

on:
  pull_request:
  workflow_dispatch:
    inputs:
      trusted_ref:
        description: Trusted base commit or ref to validate against
        required: true
        type: string
      candidate_ref:
        description: Untrusted candidate commit or ref to validate
        required: true
        type: string
      generated:
        description: Validate a trusted generated-output maintenance PR
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event_name == 'pull_request' &&
      !startsWith(github.event.pull_request.head.ref, 'automation/generated/') &&
      !startsWith(github.event.pull_request.head.ref, 'maintenance/')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out trusted receiver revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.trusted_ref || github.event.pull_request.base.sha || github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Check out untrusted candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_ref || github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Trusted cheap preflight
        run: >-
          python3 trusted/tools/validate-submission
          --base-dir "$GITHUB_WORKSPACE/trusted"
          --candidate-dir "$GITHUB_WORKSPACE/candidate"
          --preflight-only
          --json-out "$GITHUB_WORKSPACE/preflight-report.json"

      - name: Build trusted validation image
        run: docker build -f trusted/tools/Dockerfile.validator -t leanfrontier-validator:ci trusted

      # The candidate lakefile has already been proven identical to trusted
      # infrastructure. Network is available only for dependency acquisition.
      - name: Fetch pinned dependencies and compiled Mathlib cache
        run: |
          for attempt in 1 2 3; do
            docker run --rm \
              -v "$GITHUB_WORKSPACE/elan:/elan" \
              -v "$GITHUB_WORKSPACE/candidate:/candidate" \
              -w /candidate \
              leanfrontier-validator:ci sh -c 'lake update && lake exe cache get' && exit 0
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 5
          done

      - name: Restricted formal validation
        run: |
          mkdir -p "$GITHUB_WORKSPACE/report-output"
          chmod 0777 "$GITHUB_WORKSPACE/report-output"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --memory 2g --cpus 2 --pids-limit 512 \
            --tmpfs /tmp:size=2g \
            -v "$GITHUB_WORKSPACE/elan:/elan:ro" \
            -v "$GITHUB_WORKSPACE/trusted:/trusted:ro" \
            -v "$GITHUB_WORKSPACE/candidate:/candidate:ro" \
            -v "$GITHUB_WORKSPACE/candidate/.lake:/candidate/.lake" \
            -v "$GITHUB_WORKSPACE/report-output:/report-output" \
            -w /candidate \
            -e PYTHONPATH=/trusted/tools \
            leanfrontier-validator:ci \
            python3 /trusted/tools/validate-submission \
            --base-dir /trusted --candidate-dir /candidate \
            --json-out /report-output/report.json

      - name: Upload receiver report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leanfrontier-validation-report
          path: |
            preflight-report.json
            report-output/report.json
          if-no-files-found: warn

  validate-generated:
    if: >-
      (github.event_name == 'pull_request' &&
       startsWith(github.event.pull_request.head.ref, 'automation/generated/') &&
       github.event.pull_request.user.login == 'github-actions[bot]') ||
      (github.event_name == 'workflow_dispatch' && inputs.generated == true)
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.trusted_ref || github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.candidate_ref || github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - run: >-
          python3 trusted/tools/validate_generated.py
          --base trusted --candidate candidate

  validate-maintenance:
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.event.pull_request.head.ref, 'maintenance/') &&
      (github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.user.login == 'github-actions[bot]')
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Confirm this is an owner maintenance pull request
        run: |
          git -C candidate diff --check
          if [[ "${{ github.event.pull_request.head.ref }}" == maintenance/mathlib-upgrade-* && "${{ github.event.pull_request.user.login }}" == "github-actions[bot]" ]]; then
            python3 trusted/tools/validate_mathlib_upgrade.py --base trusted --candidate candidate
          fi
