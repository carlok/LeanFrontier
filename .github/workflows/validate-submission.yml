name: validate-submission

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out trusted receiver revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: trusted
          fetch-depth: 1
          persist-credentials: false

      - name: Check out untrusted candidate revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Trusted cheap preflight
        run: >-
          python3 trusted/tools/validate-submission
          --base-dir "$GITHUB_WORKSPACE/trusted"
          --candidate-dir "$GITHUB_WORKSPACE/candidate"
          --preflight-only
          --json-out "$GITHUB_WORKSPACE/preflight-report.json"

      - name: Build trusted validation image
        run: docker build -f trusted/tools/Dockerfile.validator -t leanfrontier-validator:ci trusted

      # The candidate lakefile has already been proven identical to trusted
      # infrastructure. Network is available only for dependency acquisition.
      - name: Fetch pinned dependencies and compiled Mathlib cache
        run: >-
          docker run --rm
          -v "$GITHUB_WORKSPACE/elan:/elan"
          -v "$GITHUB_WORKSPACE/candidate:/candidate"
          -w /candidate
          leanfrontier-validator:ci sh -lc 'lake update && lake exe cache get'

      - name: Restricted formal validation
        run: >-
          docker run --rm --network none --read-only --cap-drop ALL
          --security-opt no-new-privileges
          --memory 2g --cpus 2 --pids-limit 512
          --tmpfs /tmp:size=2g
          -v "$GITHUB_WORKSPACE/elan:/elan:ro"
          -v "$GITHUB_WORKSPACE/trusted:/trusted:ro"
          -v "$GITHUB_WORKSPACE/candidate:/candidate"
          -w /candidate
          -e PYTHONPATH=/trusted/tools
          leanfrontier-validator:ci
          python3 /trusted/tools/validate-submission
          --base-dir /trusted --candidate-dir /candidate
          --json-out /candidate/.frontier/report.json

      - name: Upload receiver report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: leanfrontier-validation-report
          path: |
            preflight-report.json
            candidate/.frontier/report.json
          if-no-files-found: warn
